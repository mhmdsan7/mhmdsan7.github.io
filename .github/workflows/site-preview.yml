# TEMPORARY: publishes the built redesign to a throwaway `site-preview` branch
# so it can be reviewed. Removed before the redesign is merged.
name: Site preview (temporary)

on:
  push:
    branches: ["redesign/**"]

permissions:
  contents: write

concurrency:
  group: site-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Add preview-only content (templates and a component gallery)
        run: |
          d=$(date -u +%Y-%m-%d)
          for f in _drafts/*.md; do
            sed '/^published: false$/d' "$f" > "_posts/${d}-preview-$(basename "$f")"
          done
          cp .github/preview/components.md "_posts/${d}-preview-components.md"

      - name: Build with the GitHub Pages Jekyll builder
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Push the built site to the site-preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r _site /tmp/site
          cd /tmp/site
          git init -q -b site-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-preview
