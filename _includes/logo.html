{%- comment -%} APT-966 mark. Pass a unique id when used more than once per page. {%- endcomment -%}
{%- assign logo_id = include.id | default: "header" -%}
<svg class="logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="logo-gradient-{{ logo_id }}" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop class="logo-stop-a" offset="0" stop-color="#38BDF8"/>
      <stop class="logo-stop-b" offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <path d="M16 3 27.26 9.5v13L16 29 4.74 22.5v-13Z" fill="none" stroke="url(#logo-gradient-{{ logo_id }})" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M16 16V9.4M16 16l5.7 3.3M16 16l-5.7 3.3" fill="none" stroke="url(#logo-gradient-{{ logo_id }})" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="2.7" fill="url(#logo-gradient-{{ logo_id }})"/>
</svg>
